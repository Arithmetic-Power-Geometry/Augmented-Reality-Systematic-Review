name: Benchmark integrity

on:
  push:
    paths:
      - "benchmarks/tracking_localization_slam/**"
      - ".github/workflows/benchmark-integrity.yml"
  pull_request:
    paths:
      - "benchmarks/tracking_localization_slam/**"

jobs:
  integrity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax checks
        run: python -m py_compile benchmarks/tracking_localization_slam/scripts/*.py benchmarks/tracking_localization_slam/adapters/*.py

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("benchmarks/tracking_localization_slam/manifests").glob("*.json"):
              json.loads(p.read_text())
              print("valid json:", p)
          PY

      - name: Verify CSV readability
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for p in Path("benchmarks/tracking_localization_slam").rglob("*.csv"):
              with p.open(newline="", encoding="utf-8") as f:
                  rows=list(csv.reader(f))
              if not rows:
                  raise SystemExit(f"empty csv: {p}")
              print("readable csv:", p)
          PY

      - name: Run synthetic adapter smoke test
        run: python benchmarks/tracking_localization_slam/scripts/test_adapter.py

      - name: Ensure planned manifests cannot masquerade as results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("benchmarks/tracking_localization_slam/manifests").glob("planned_*.json"):
              d=json.loads(p.read_text())
              assert d["status"] == "planned", f"{p} must remain planned"
              assert d.get("raw_output_sha256") in (None, ""), f"{p} contains raw output despite planned status"
          print("PLANNED_MANIFEST_GUARD_OK")
          PY

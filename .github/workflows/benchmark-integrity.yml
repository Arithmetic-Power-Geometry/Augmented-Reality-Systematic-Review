name: Benchmark integrity

on:
  push:
    paths:
      - "benchmarks/tracking_localization_slam/**"
      - ".github/workflows/benchmark-integrity.yml"
  pull_request:
    paths:
      - "benchmarks/tracking_localization_slam/**"

jobs:
  integrity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax checks
        run: python -m py_compile benchmarks/tracking_localization_slam/scripts/*.py benchmarks/tracking_localization_slam/adapters/*.py

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("benchmarks/tracking_localization_slam/manifests").glob("*.json"):
              json.loads(p.read_text())
              print("valid json:", p)
          PY

      - name: Verify CSV readability
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for p in Path("benchmarks/tracking_localization_slam").rglob("*.csv"):
              with p.open(newline="", encoding="utf-8") as f:
                  rows=list(csv.reader(f))
              if not rows:
                  raise SystemExit(f"empty csv: {p}")
              print("readable csv:", p)
          PY

      - name: Run synthetic adapter smoke test
        run: python benchmarks/tracking_localization_slam/scripts/test_adapter.py

      - name: Ensure planned manifests cannot masquerade as results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("benchmarks/tracking_localization_slam/manifests").glob("planned_*.json"):
              d=json.loads(p.read_text())
              assert d["status"] == "planned", f"{p} must remain planned"
              assert d.get("raw_output_sha256") in (None, ""), f"{p} contains raw output despite planned status"
          print("PLANNED_MANIFEST_GUARD_OK")
          PY


      - name: Validate normalized synthetic trajectory
        run: |
          tmp=$(mktemp)
          python benchmarks/tracking_localization_slam/adapters/tum_trajectory_to_common.py \
            benchmarks/tracking_localization_slam/testdata/synthetic_tum.txt "$tmp"
          python benchmarks/tracking_localization_slam/scripts/validate_common_trajectory.py "$tmp"

      - name: Guard scientific result provenance
        run: |
          python benchmarks/tracking_localization_slam/scripts/guard_result_provenance.py \
            benchmarks/tracking_localization_slam/results_schema.csv


      - name: Dataset provenance recorder self-test
        run: |
          tmpdir=$(mktemp -d)
          printf 'synthetic-not-a-dataset\n' > "$tmpdir/input.bin"
          python benchmarks/tracking_localization_slam/scripts/record_dataset_provenance.py \
            "$tmpdir/input.bin" --dataset SYNTHETIC --sequence TEST \
            --source https://example.invalid/not-a-real-dataset --output "$tmpdir/provenance.json"
          python - <<PY
          import json
          from pathlib import Path
          p=Path("$tmpdir/provenance.json")
          d=json.loads(p.read_text())
          assert len(d["sha256"])==64
          assert d["dataset"]=="SYNTHETIC"
          print("DATASET_PROVENANCE_RECORDER_OK")
          PY

      - name: E001 immutable source guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("benchmarks/tracking_localization_slam/manifests/E001_R01_planned.json")
          d=json.loads(p.read_text())
          expected="4452a3c4ab75b1cde34e5505a36ec3f9edcdc4c4"
          assert d["method_commit"]==expected
          assert d["status"]=="planned"
          assert d["raw_output_sha256"] is None
          print("E001_SOURCE_FREEZE_OK")
          PY

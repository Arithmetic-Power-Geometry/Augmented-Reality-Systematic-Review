name: Run77 prepare all screening batches
on:
  push:
    branches: [main]
    paths: [".github/workflows/run77-prepare-all-screening.yml"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/build_formal_pubmed_screening_batches.py
      - run: python scripts/prepare_all_screening_batches_run77.py
      - name: Commit generated reviewer packets
        run: |
          git pull --rebase origin main
          python scripts/build_formal_pubmed_screening_batches.py
          python scripts/prepare_all_screening_batches_run77.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/screening/reviewer_ready/ evidence/screening/final_title_abstract_ledger.csv paper_writing/paper_artifacts/provenance/RUN77_ALL_BATCH_PREPARATION.json
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Run77 all screening reviewer packets"
          git push

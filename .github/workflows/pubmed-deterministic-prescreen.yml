name: PubMed Deterministic Prescreen

on:
  push:
    paths:
      - '.github/workflows/pubmed-deterministic-prescreen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prescreen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply only deterministic protocol exclusions
        run: |
          python - <<'PY'
          import csv, hashlib
          from pathlib import Path
          src=Path('evidence/search/derived/pubmed/PUBMED_Q00_METADATA_2026-10-05.csv')
          out=Path('evidence/search/derived/pubmed/PUBMED_Q00_DETERMINISTIC_PRESCREEN_2026-10-05.csv')
          rows=list(csv.DictReader(src.open(encoding='utf-8')))
          secondary={'Review','Systematic Review','Meta-Analysis','Editorial','Comment','Letter','News'}
          counts={}
          for r in rows:
              types={x.strip() for x in r['publication_types'].split(';') if x.strip()}
              langs={x.strip().lower() for x in r['language'].split(';') if x.strip()}
              if r['metadata_status']!='retrieved':
                  d,reason='UNCERTAIN_REQUIRES_SCREENING','METADATA_UNAVAILABLE'
              elif langs and 'eng' not in langs:
                  d,reason='EXCLUDE_DETERMINISTIC','E-LANGUAGE'
              elif types & secondary:
                  d,reason='EXCLUDE_DETERMINISTIC','E-SECONDARY'
              else:
                  d,reason='UNCERTAIN_REQUIRES_SCREENING','TITLE_ABSTRACT_REVIEW_REQUIRED'
              r['prescreen_decision']=d; r['prescreen_reason']=reason
              counts[(d,reason)]=counts.get((d,reason),0)+1
          fields=list(rows[0].keys())
          with out.open('w',newline='',encoding='utf-8') as h:
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(rows)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          summary=Path('evidence/search/derived/pubmed/PUBMED_Q00_DETERMINISTIC_PRESCREEN_SUMMARY.md')
          summary.write_text('# PubMed Q00 Deterministic Prescreen\n\nTotal: '+str(len(rows))+'\n\n'+'\n'.join(f'- {k[0]} / {k[1]}: {v}' for k,v in sorted(counts.items()))+'\n\nSHA-256: '+sha+'\n',encoding='utf-8')
          print(counts,sha)
          PY
      - name: Commit prescreen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/search/derived/pubmed
          git commit -m "Apply deterministic prescreen to formal PubMed Q00 corpus" || exit 0
          git push

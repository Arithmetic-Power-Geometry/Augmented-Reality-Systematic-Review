name: Run74 TA06 stabilized pipeline
on:
  push:
    branches: [main]
    paths: [".github/workflows/run74-ta06-pipeline.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/build_formal_pubmed_screening_batches.py
      - run: python scripts/build_ta06_assisted_triage.py
      - run: |
          git pull --rebase origin main
          python scripts/build_formal_pubmed_screening_batches.py
          python scripts/build_ta06_assisted_triage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/screening/formal_pubmed_batches/TA-06.csv evidence/screening/assisted/TA-06_ASSISTED_TRIAGE_RUN60.csv
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Run74 TA06 evidence"
          git push

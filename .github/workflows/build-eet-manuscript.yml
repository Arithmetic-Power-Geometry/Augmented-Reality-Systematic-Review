name: Build EET Manuscript
on:
  push:
    paths:
      - 'EET_Final_Manuscript_2026-10-07/**'
      - '.github/workflows/build-eet-manuscript.yml'
  workflow_dispatch:
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize BibTeX
        run: |
          cd EET_Final_Manuscript_2026-10-07
          python3 - <<'PY'
          from pathlib import Path
          p=Path('references.bib')
          s=p.read_text()
          out=[]
          for i,ch in enumerate(s):
              if ch=='&' and (i==0 or s[i-1] != chr(92)):
                  out.append(chr(92)+'&')
              else:
                  out.append(ch)
          p.write_text(''.join(out))
          PY
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: EET_Final_Manuscript_2026-10-07
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Build source ZIP
        run: |
          cd EET_Final_Manuscript_2026-10-07
          cp main.pdf EET_IEEE_Manuscript.pdf
          zip -r EET_IEEE_Submission_Package.zip main.tex references.bib README.md cover_letter.tex highlights.txt CITATION.cff STATUS.csv EET_IEEE_Manuscript.pdf
      - name: Upload compiled deliverables
        uses: actions/upload-artifact@v4
        with:
          name: EET-IEEE-Submission-Package
          path: |
            EET_Final_Manuscript_2026-10-07/EET_IEEE_Manuscript.pdf
            EET_Final_Manuscript_2026-10-07/EET_IEEE_Submission_Package.zip
          retention-days: 30
      - name: Commit compiled PDF and ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EET_Final_Manuscript_2026-10-07/EET_IEEE_Manuscript.pdf EET_Final_Manuscript_2026-10-07/EET_IEEE_Submission_Package.zip
          git commit -m "Build compiled EET manuscript deliverables" || exit 0
          git push

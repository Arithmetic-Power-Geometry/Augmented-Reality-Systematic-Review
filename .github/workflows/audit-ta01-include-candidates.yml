name: Audit TA-01 include candidates
on:
  push:
    branches: [main]
    paths: ["scripts/audit_ta01_include_candidates.py"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/audit_ta01_include_candidates.py
      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/screening/assisted/TA-01_INCLUDE_CANDIDATE_AUDIT_RUN62.csv paper_writing/paper_artifacts/provenance/RUN62_TA01_INCLUDE_AUDIT.json
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Run 62 TA-01 include audit"
          git push

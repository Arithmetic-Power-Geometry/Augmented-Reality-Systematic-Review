name: Build TA-01 reviewer-ready sheet
on:
  push:
    branches: [main]
    paths: ["scripts/build_ta01_reviewer_ready_sheet.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/build_ta01_reviewer_ready_sheet.py
      - name: Commit reviewer-ready sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/screening/reviewer_ready/TA-01_REVIEWER_READY_RUN64.csv
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Run 64 TA-01 reviewer-ready sheet"
          git pull --rebase origin main
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660">
<rect width="1300" height="660" fill="white"/>
<text x="650" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Clinical AR: From Technical Feasibility to Patient Evidence</text>
<g font-family="Arial" text-anchor="middle">
<g font-size="16">
<rect x="35" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="110" y="152">C0</text><text x="110" y="178">Technical</text>
<rect x="215" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="290" y="152">C1</text><text x="290" y="178">Training</text>
<rect x="395" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="470" y="152">C2</text><text x="470" y="178">Patient feasibility</text>
<rect x="575" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="650" y="152">C3</text><text x="650" y="178">Clinical performance</text>
<rect x="755" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="830" y="152">C4</text><text x="830" y="178">Comparative</text>
<rect x="935" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="1010" y="152">C5</text><text x="1010" y="178">Patient outcome</text>
<rect x="1115" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="1190" y="152">C6</text><text x="1190" y="178">Multicenter/long.</text>
</g>
<g stroke="#333" stroke-width="3"><path d="M185 162H215"/><path d="M365 162H395"/><path d="M545 162H575"/><path d="M725 162H755"/><path d="M905 162H935"/><path d="M1085 162H1115"/></g>
<text x="650" y="285" font-size="22" font-weight="bold">Evidence cannot skip translation levels</text>
<rect x="90" y="340" width="320" height="115" rx="12" fill="#f4f4f4" stroke="#333"/><text x="250" y="380" font-size="18">Technical evidence</text><text x="250" y="410" font-size="15">accuracy / latency / registration</text>
<rect x="490" y="340" width="320" height="115" rx="12" fill="#f4f4f4" stroke="#333"/><text x="650" y="380" font-size="18">Operator/workflow</text><text x="650" y="410" font-size="15">skill / time / workload / radiation</text>
<rect x="890" y="340" width="320" height="115" rx="12" fill="#f4f4f4" stroke="#333"/><text x="1050" y="380" font-size="18">Clinical evidence</text><text x="1050" y="410" font-size="15">patient outcome / safety / implementation</text>
<text x="650" y="535" font-size="19">Navigation accuracy does not by itself establish clinical effectiveness.</text>
<text x="650" y="570" font-size="19">Training benefit does not by itself establish patient benefit.</text>
</g>
</svg>
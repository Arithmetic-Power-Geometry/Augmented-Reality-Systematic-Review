<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660">
<rect width="1300" height="660" fill="white"/>
<text x="650" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">AR–Digital Twin: From Overlay to Operational Synchronization</text>
<g font-family="Arial" text-anchor="middle">
<g font-size="16">
<rect x="35" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="110" y="152">D0</text><text x="110" y="178">Static overlay</text>
<rect x="215" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="290" y="152">D1</text><text x="290" y="178">Digital model</text>
<rect x="395" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="470" y="152">D2</text><text x="470" y="178">Digital shadow</text>
<rect x="575" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="650" y="152">D3</text><text x="650" y="178">Connected AR</text>
<rect x="755" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="830" y="152">D4</text><text x="830" y="178">Bidirectional</text>
<rect x="935" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="1010" y="152">D5</text><text x="1010" y="178">Closed loop</text>
<rect x="1115" y="120" width="150" height="85" rx="10" fill="#f4f4f4" stroke="#333"/><text x="1190" y="152">D6</text><text x="1190" y="178">Lifecycle field</text>
</g>
<g stroke="#333" stroke-width="3"><path d="M185 162H215"/><path d="M365 162H395"/><path d="M545 162H575"/><path d="M725 162H755"/><path d="M905 162H935"/><path d="M1085 162H1115"/></g>
<text x="650" y="285" font-size="22" font-weight="bold">Evidence required as synchronization claims strengthen</text>
<rect x="90" y="340" width="320" height="110" rx="12" fill="#f4f4f4" stroke="#333"/><text x="250" y="378" font-size="18">Physical -> digital</text><text x="250" y="407" font-size="15">sensing + update + state consistency</text>
<rect x="490" y="340" width="320" height="110" rx="12" fill="#f4f4f4" stroke="#333"/><text x="650" y="378" font-size="18">Digital -> physical</text><text x="650" y="407" font-size="15">control + authority + safety</text>
<rect x="890" y="340" width="320" height="110" rx="12" fill="#f4f4f4" stroke="#333"/><text x="1050" y="378" font-size="18">Operational validity</text><text x="1050" y="407" font-size="15">latency + interoperability + field use</text>
<text x="650" y="535" font-size="19">A 3D/BIM/CAD model shown in AR is not automatically a digital twin.</text>
<text x="650" y="570" font-size="19">Terminology does not determine maturity; demonstrated data flow and synchronization do.</text>
</g>
</svg>
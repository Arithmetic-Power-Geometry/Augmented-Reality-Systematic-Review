<rect x="255" y="115" width="170" height="90" rx="10" fill="#f4f4f4" stroke="#333"/><text x="340" y="150">Immutable export</text><text x="340" y="178">SHA-256</text>
<rect x="465" y="115" width="170" height="90" rx="10" fill="#f4f4f4" stroke="#333"/><text x="550" y="150">Canonical pool</text><text x="550" y="178">normalized metadata</text>
<rect x="675" y="115" width="170" height="90" rx="10" fill="#f4f4f4" stroke="#333"/><text x="760" y="150">Dedup candidates</text><text x="760" y="178">exact + fuzzy flag</text>
<rect x="885" y="115" width="170" height="90" rx="10" fill="#f4f4f4" stroke="#333"/><text x="970" y="150">Human decisions</text><text x="970" y="178">dedup + families</text>
<rect x="1095" y="115" width="160" height="90" rx="10" fill="#f4f4f4" stroke="#333"/><text x="1175" y="150">Screening</text><text x="1175" y="178">frozen ledger</text>
<g stroke="#333" stroke-width="3"><path d="M215 160H255"/><path d="M425 160H465"/><path d="M635 160H675"/><path d="M845 160H885"/><path d="M1055 160H1095"/></g>

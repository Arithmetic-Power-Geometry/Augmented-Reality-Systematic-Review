<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><rect width="1280" height="650" fill="white"/><text x="640" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Run 41: Conditional Rehabilitation Evidence</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="120" width="250" height="95" rx="12" fill="#f4f4f4" stroke="#333"/><text x="185" y="153" font-size="18">Stroke AR</text><text x="185" y="183" font-size="15">balance ≠ all mobility outcomes</text><rect x="365" y="120" width="250" height="95" rx="12" fill="#f4f4f4" stroke="#333"/><text x="490" y="153" font-size="18">Knee rehabilitation</text><text x="490" y="183" font-size="15">outcome + horizon dependent</text><rect x="670" y="120" width="250" height="95" rx="12" fill="#f4f4f4" stroke="#333"/><text x="795" y="153" font-size="18">Neurocognitive XR</text><text x="795" y="183" font-size="15">AR evidence remains sparse</text><rect x="975" y="120" width="250" height="95" rx="12" fill="#f4f4f4" stroke="#333"/><text x="1100" y="153" font-size="18">SCI XR</text><text x="1100" y="183" font-size="15">psychological outcome layer</text><path d="M185 215V310H640M490 215V310H640M795 215V310H640M1100 215V310H640" stroke="#333" fill="none"/><rect x="345" y="310" width="590" height="135" rx="15" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="640" y="350" font-size="21" font-weight="bold">Do not collapse to “AR rehabilitation works”</text><text x="640" y="385" font-size="16">retain population • modality • comparator • outcome • setting • horizon</text><text x="640" y="415" font-size="16">secondary reviews inform evidence architecture, not primary-corpus counts</text><path d="M640 445V505" stroke="#333" stroke-width="3"/><rect x="415" y="505" width="450" height="80" rx="12" fill="#f4f4f4" stroke="#333"/><text x="640" y="540" font-size="18">Conditional cross-study synthesis</text><text x="640" y="565" font-size="15">supports C0–C3 comparability decisions</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><rect width="1280" height="650" fill="white"/><text x="640" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Run 42: Why XR Evidence Cannot Be Collapsed into AR Evidence</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="115" width="300" height="100" rx="12" fill="#f4f4f4" stroke="#333"/><text x="240" y="150" font-size="19">Mixed-XR review</text><text x="240" y="180" font-size="15">AR + MR + VR evidence</text><rect x="490" y="115" width="300" height="100" rx="12" fill="#f4f4f4" stroke="#333"/><text x="640" y="150" font-size="19">Separability test</text><text x="640" y="180" font-size="15">Can AR-specific evidence be extracted?</text><rect x="890" y="115" width="300" height="100" rx="12" fill="#f4f4f4" stroke="#333"/><text x="1040" y="150" font-size="19">Condition retention</text><text x="1040" y="180" font-size="15">device • task • user • outcome</text><path d="M390 165H490M790 165H890" stroke="#333" stroke-width="3"/><rect x="175" y="330" width="260" height="100" rx="12" fill="#f4f4f4" stroke="#333"/><text x="305" y="365" font-size="18">AR_SEPARABLE</text><text x="305" y="395" font-size="15">eligible for AR synthesis</text><rect x="510" y="330" width="260" height="100" rx="12" fill="#f4f4f4" stroke="#333"/><text x="640" y="365" font-size="18">XR_CONTEXT_ONLY</text><text x="640" y="395" font-size="15">theory/positioning only</text><rect x="845" y="330" width="260" height="100" rx="12" fill="#f4f4f4" stroke="#333"/><text x="975" y="365" font-size="18">EXCLUDE_AR_SYNTHESIS</text><text x="975" y="395" font-size="15">non-AR evidence dominates</text><path d="M640 215V275M640 275H305V330M640 275V330M640 275H975V330" stroke="#333" fill="none" stroke-width="2"/><rect x="335" y="510" width="610" height="80" rx="12" fill="#f4f4f4" stroke="#333"/><text x="640" y="543" font-size="18" font-weight="bold">No pooled XR effect is automatically an AR effect</text><text x="640" y="568" font-size="15">comparability requires modality-specific evidence and retained conditions</text></g></svg>